[project]
name = "LoraQuant"
version = "0.1.0"
description = "loraquant reproduction project"
readme = "README.md"
authors = [
    { name = "Agoth Arop", email = "agoth.a3@gmail.com" }
]
requires-python = ">=3.13"
dependencies = [
    "numpy>=2.5.3",
    "torch>=2.14.1",
]

[project.scripts]
loraquant = "loraquant:main"

[build-system]
requires = ["uv_build>=0.12.5,<0.13.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "lq"
