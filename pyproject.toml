[project]
name = "LoraQuant"
version = "0.1.0"
description = "loraquant reproduction project"
readme = "README.md"
authors = [
    { name = "Agoth Arop", email = "agoth.a3@gmail.com" }
]
requires-python = "==3.12.*"
dependencies = [
    "accelerate>=1.14.0",
    "bitsandbytes>=0.50.1",
    "jaxtyping>=0.3.11",
    "lm-eval[hf]>=0.4.11",
    "numpy>=2.5.3",
    "peft>=0.19.1",
    "torch>=2.14.1",
    "transformers>=5.20.1",
]

[project.scripts]
lq = "lq.main:main"

[build-system]
requires = ["uv_build>=0.12.5,<0.13.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "lq"

[dependency-groups]
dev = [
    "pytest>=9.2.0",
]

[tool.uv]
required-environments = ["sys_platform == 'linux' and platform_machine == 'x86_64'"]
